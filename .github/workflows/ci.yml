name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: '2022'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target-name: Windows
          - os: ubuntu-latest
            target-name: Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Setup Python 3.11 (Windows node-gyp)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install setuptools

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev rpm libfuse2 || sudo apt-get install -y libsecret-1-dev rpm libfuse2t64 || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup native modules and Electron binary
        run: npm run setup

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build frontend & main bundles
        run: npx electron-vite build
