name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each platform only builds. Publishing from both matrix jobs raced to create the release, and
  # electron-builder silently skips uploads to a release published more than 2 hours earlier,
  # which is how v0.1.0 ended up without its Windows installer.
  build:
    name: Build (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: '2022'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            target-name: Windows
            platform-flag: --win
          # Pinned: electron-builder's bundled fpm 1.9.3 fails with rpmbuild on ubuntu-26.04 (ubuntu-latest since Nov 2026).
          - os: ubuntu-24.04
            target-name: Linux
            platform-flag: --linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Setup Python 3.11 (Windows node-gyp)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install setuptools

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev rpm libfuse2 || sudo apt-get install -y libsecret-1-dev rpm libfuse2t64 || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup native modules and Electron binary
        run: npm run setup

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build frontend & main bundles
        run: npx electron-vite build

      - name: Package
        run: npx electron-builder ${{ matrix.platform-flag }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auramail-${{ matrix.target-name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ github.event.inputs.draft }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          # A pushed tag must match package.json, otherwise installers and latest*.yml carry the wrong version.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}."
            exit 1
          fi

          # Never attach new builds to a release whose tag points at different code; bump the version instead.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "::error::${TAG} already points at ${TAG_SHA}, not ${GITHUB_SHA}. Bump the version in package.json."
              exit 1
            fi
          fi

          ls -la dist
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            FLAGS=()
            [ "${DRAFT:-false}" = "true" ] && FLAGS+=(--draft)
            [ "${PRERELEASE:-false}" = "true" ] && FLAGS+=(--prerelease)
            gh release create "${TAG}" dist/* --title "${VERSION}" --target "${GITHUB_SHA}" --generate-notes "${FLAGS[@]}"
          fi
