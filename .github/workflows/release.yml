name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target-name: Windows
            platform-flag: --win
          - os: ubuntu-latest
            target-name: Linux
            platform-flag: --linux

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Configure Visual Studio 2022 (Windows)
        if: runner.os == 'Windows'
        run: npm config set msvs_version 2022

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev rpm libfuse2 || sudo apt-get install -y libsecret-1-dev rpm libfuse2t64 || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup native modules and Electron binary
        run: npm run setup

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build frontend & main bundles
        run: npx electron-vite build

      - name: Package & Publish to GitHub Releases (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseType = "release"
          if ("${{ github.ref_type }}" -ne "tag" -or "${{ github.event.inputs.draft }}" -eq "true") {
            $releaseType = "draft"
          } elseif ("${{ github.event.inputs.prerelease }}" -eq "true") {
            $releaseType = "prerelease"
          }
          Write-Host "Publishing Windows release as: $releaseType"
          npx electron-builder --win --publish always -c.publish.releaseType=$releaseType

      - name: Package & Publish to GitHub Releases (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TYPE="release"
          if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ github.event.inputs.draft }}" = "true" ]; then
            RELEASE_TYPE="draft"
          elif [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            RELEASE_TYPE="prerelease"
          fi
          echo "Publishing Linux release as: $RELEASE_TYPE"
          npx electron-builder --linux --publish always -c.publish.releaseType=$RELEASE_TYPE

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auramail-${{ matrix.target-name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
          if-no-files-found: ignore
